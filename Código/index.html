<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huella energética de la nube</title>
<style>
  :root {
    --verde: #2e7d32;
    --verde-oscuro: #1b5e20;
    --azul: #0277bd;
    --fondo: #eef6f3;
    --texto: #1c2b24;
    --borde: #c5dcd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, var(--verde-oscuro), var(--azul));
    color: #fff;
    padding: 28px 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 1.8rem; }
  header p { margin: 0 auto; max-width: 640px; opacity: .95; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
  .tarjeta {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 18px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 6px; }
  label small { display: block; font-weight: 400; color: #55675d; }
  input[type=number] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--borde);
    border-radius: 8px;
  }
  input[type=number]:focus { outline: 2px solid var(--verde); border-color: var(--verde); }
  button {
    margin-top: 18px;
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    background: var(--verde);
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  #resultado {
    display: none;
    margin-top: 18px;
    background: #fff;
    border-left: 5px solid var(--azul);
    border-radius: 10px;
    padding: 16px;
    white-space: pre-line;
  }
  footer { text-align: center; font-size: .85rem; color: #5a6b62; padding-bottom: 24px; }
  @media (max-width: 560px) {
    header h1 { font-size: 1.45rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Huella energética de la nube</h1>
  <p>Cada video, foto en la nube o pregunta a una IA se procesa en centros de datos que consumen energía y agua. Esta página estima tu huella digital semanal.</p>
</header>

<main>
  <form id="formulario" class="tarjeta">
    <div class="grid">
      <div>
        <label for="video">Video en streaming <small>horas al día (YouTube, Netflix, TikTok)</small></label>
        <input type="number" id="video" name="video" min="0" step="0.1" value="0">
      </div>
      <div>
        <label for="musica">Música en streaming <small>horas al día</small></label>
        <input type="number" id="musica" name="musica" min="0" step="0.1" value="0">
      </div>
      <div>
        <label for="redes">Redes sociales <small>horas al día</small></label>
        <input type="number" id="redes" name="redes" min="0" step="0.1" value="0">
      </div>
      <div>
        <label for="videollamadas">Videollamadas <small>horas a la semana</small></label>
        <input type="number" id="videollamadas" name="videollamadas" min="0" step="0.1" value="0">
      </div>
      <div>
        <label for="juegos">Juegos en línea <small>horas al día</small></label>
        <input type="number" id="juegos" name="juegos" min="0" step="0.1" value="0">
      </div>
      <div>
        <label for="nube">Almacenamiento en la nube <small>GB guardados (fotos, archivos)</small></label>
        <input type="number" id="nube" name="nube" min="0" step="1" value="0">
      </div>
      <div>
        <label for="ia">Chatbots de IA <small>consultas al día</small></label>
        <input type="number" id="ia" name="ia" min="0" step="1" value="0">
      </div>
      <div>
        <label for="correos">Correos <small>correos que envías al día</small></label>
        <input type="number" id="correos" name="correos" min="0" step="1" value="0">
      </div>
    </div>
    <button type="submit" id="btnCalcular">Calcular mi huella</button>
  </form>

  <div id="resultado"></div>
</main>

<footer>Desarrollo Sustentable · Práctica 4.3 · Instituto Tecnológico de Mazatlán</footer>

<script>
  // PEGA AQUI LA URL DE TU WEBHOOK DE MAKE (Webhooks -> Custom webhook -> Copy address)
  const WEBHOOK_URL = "https://hook.us2.make.com/oy2nk4ta9oqnsnlll6q8z39scu5f0qu9";

  const CAMPOS = ["video", "musica", "redes", "videollamadas", "juegos", "nube", "ia", "correos"];
  const form = document.getElementById("formulario");
  const boton = document.getElementById("btnCalcular");
  const resultado = document.getElementById("resultado");

  function mostrar(texto) {
    resultado.textContent = texto;
    resultado.style.display = "block";
  }

  form.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const datos = new URLSearchParams();
    for (const campo of CAMPOS) {
      const valor = Math.max(0, Number(document.getElementById(campo).value) || 0);
      datos.append(campo, String(valor));
    }

    boton.disabled = true;
    mostrar("Calculando...");
    try {
      const respuesta = await fetch(WEBHOOK_URL, { method: "POST", body: datos });
      if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);
      mostrar(await respuesta.text());
    } catch (error) {
      mostrar("No se pudo calcular, intenta de nuevo.");
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
